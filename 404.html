<style>
/* ===== MATES 404 — self-contained ===== */
:root {
  color-scheme: light;
  --ink: #1B3A6B; --ink-2: #10234A; --paper: #F5F6EF; --paper-2: #ECEEE3;
  --chalk: #F4F7FB; --chalk-deep: #2F5D94; --coral: #C6512F;
  --text: #202B38; --text-muted: #4E5C70; --line: #DAD9CC; --white: #FFFFFF;
  --blue-50: #E3EDF8; --blue-100: #DCE9F7; --blue-200: #C9DDF2;
  --font-display: "Space Grotesk", "Segoe UI", sans-serif;
  --font-body: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  --font-mono: ui-monospace, "Cascadia Mono", Menlo, Consolas, monospace;
  --font-hand: "Caveat", cursive;
  --radius-sm: 4px; --radius-md: 8px; --ease: cubic-bezier(0.4,0,0.2,1);
  --hero-bg: #10234A;
}
[data-theme="dark"] {
  color-scheme: dark;
  --ink: #DCE5F1; --ink-2: #0A111F; --paper: #0F1729; --paper-2: #16213A;
  --chalk: #F4F7FB; --chalk-deep: #8FB4E0; --coral: #E37E5A;
  --text: #C9D4E2; --text-muted: #9AA7BA; --line: rgba(220,231,245,0.14);
  --white: #17223B; --blue-50: #22355A; --blue-100: #2A3F68; --blue-200: #33507F;
  --hero-bg: #0B1526;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { -webkit-font-smoothing: antialiased; }
body { font-family: var(--font-body); color: var(--text); background: var(--paper); line-height: 1.65; min-height: 100vh; display: flex; flex-direction: column; }
a { color: inherit; text-decoration: none; }
h1, h2, h3 { font-family: var(--font-display); color: var(--ink); font-weight: 700; }

/* Header */
.site-header { background: var(--paper); border-bottom: 1px solid var(--line); padding: 0 24px; }
.nav { max-width: 1160px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; height: 72px; }
.nav__brand { display: flex; align-items: center; gap: 10px; font-family: var(--font-display); font-weight: 700; font-size: 1.25rem; color: var(--ink); }
.nav__logo { height: 38px; width: auto; }
.nav__menu { display: flex; gap: 4px; list-style: none; }
.nav__link { display: block; padding: 7px 12px; font-size: 0.875rem; font-weight: 500; color: var(--text); border-radius: var(--radius-sm); font-family: var(--font-mono); }
.nav__link:hover { background: var(--paper-2); color: var(--ink); }
.theme-toggle { display: inline-flex; align-items: center; justify-content: center; width: 40px; height: 40px; border-radius: var(--radius-sm); color: var(--ink); background: transparent; border: 1px solid transparent; cursor: pointer; }
.theme-toggle:hover { background: var(--paper-2); border-color: var(--line); }
.theme-toggle svg { width: 19px; height: 19px; }
.theme-toggle .icon-moon { display: none; }
[data-theme="dark"] .theme-toggle .icon-sun { display: none; }
[data-theme="dark"] .theme-toggle .icon-moon { display: block; }

/* Main */
.error-page { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 48px 24px; }
.error-code { font-family: var(--font-display); font-size: clamp(6rem, 18vw, 12rem); font-weight: 700; color: var(--chalk-deep); opacity: 0.15; line-height: 1; letter-spacing: -0.04em; }
.error-eyebrow { font-family: var(--font-mono); font-size: 0.75rem; font-weight: 500; color: var(--chalk-deep); margin: 16px 0 8px; }
.error-eyebrow::before { content: "["; }
.error-eyebrow::after { content: "]"; }
.error-title { font-size: clamp(1.5rem, 4vw, 2.2rem); color: var(--ink); margin-bottom: 14px; }
.error-text { color: var(--text-muted); font-size: 1.0625rem; max-width: 480px; margin-bottom: 36px; line-height: 1.7; }
.error-actions { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; margin-bottom: 48px; }
.btn { display: inline-flex; align-items: center; gap: 8px; padding: 14px 26px; border-radius: var(--radius-sm); font-size: 0.9375rem; font-weight: 600; border: 1.5px solid transparent; transition: all 0.15s var(--ease); }
.btn-primary { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.btn-primary:hover { background: var(--ink-2); border-color: var(--ink-2); }
.btn-outline { background: transparent; color: var(--ink); border-color: var(--ink); }
.btn-outline:hover { background: var(--ink); color: var(--paper); }

/* Chalk underline doodle */
.chalk-svg { display: block; width: min(240px, 60%); height: 14px; color: var(--chalk-deep); margin: -8px auto 20px; opacity: 0.4; }

/* Footer */
.site-footer { background: var(--ink-2); color: rgba(245,246,239,0.7); padding: 28px 24px; }
.footer-bottom { max-width: 1160px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; font-size: 0.8125rem; font-family: var(--font-mono); }
.footer-bottom a { color: rgba(245,246,239,0.78); }
.footer-bottom a:hover { color: var(--chalk); }

@media (max-width: 600px) {
  .nav__menu { display: none; }
  .error-actions { flex-direction: column; width: 100%; max-width: 320px; }
  .error-actions .btn { width: 100%; }
}
</style>

<script>
(function(){
  function applyLogo(){var d=document.documentElement.getAttribute("data-theme")==="dark";document.querySelectorAll(".nav__logo").forEach(function(i){i.setAttribute("src",d?"assets/images/logo-white.webp":"assets/images/logo.webp");var p=i.parentElement;if(p&&p.tagName==="PICTURE"){var s=p.querySelector("source");if(s)s.setAttribute("srcset",d?"assets/images/logo-white.avif":"assets/images/logo.avif")}})}
  applyLogo();
  var t=document.documentElement.getAttribute("data-theme");
  document.querySelectorAll(".theme-toggle").forEach(function(b){
    b.addEventListener("click",function(){
      var next=t==="dark"?"light":"dark";
      document.documentElement.setAttribute("data-theme",next);
      t=next;
      applyLogo();
      try{localStorage.setItem("mates-theme",next)}catch(e){}
    });
  });
})();
</script>
